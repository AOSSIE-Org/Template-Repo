name: Sync skills branch

# Keeps the `skills` branch (main + the agent/skills system) up to date by
# merging every push to main into it.
#
# Requires a SKILLS_SYNC_TOKEN secret: a fine-grained PAT with
# "Contents: read and write" and "Workflows: read and write" on this repo.
# GITHUB_TOKEN can't be used because it is not allowed to push changes to
# .github/workflows/, which most merges from main (e.g. Dependabot bumps) contain.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-skills-branch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only for the template itself, not repos generated from it
    if: github.repository == 'AOSSIE-Org/Template-Repo'

    steps:
      - name: Checkout skills branch
        uses: actions/checkout@v7
        with:
          ref: skills
          fetch-depth: 0
          token: ${{ secrets.SKILLS_SYNC_TOKEN }}

      - name: Merge main into skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "skills already contains main, nothing to do."
            exit 0
          fi

          if ! git merge --no-edit origin/main -m "Merge main into skills"; then
            git merge --abort
            echo "::error::Merge conflict between main and skills. Merge main into skills manually."
            exit 1
          fi

          git push origin HEAD:skills
